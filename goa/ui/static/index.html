<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoA — Graph of Agents</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3345;
  --text: #e1e4ed;
  --text-dim: #8b8fa3;
  --primary: #6c7bf7;
  --primary-dim: #4a55c2;
  --green: #4ade80;
  --red: #f87171;
  --yellow: #fbbf24;
  --blue: #60a5fa;
  --cyan: #22d3ee;
  --radius: 8px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
button {
  font-family: var(--font);
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  padding: 6px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  transition: all .15s;
}
button:hover { background: var(--primary-dim); border-color: var(--primary); }
button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
button.primary:hover { background: var(--primary-dim); }
button.danger { border-color: var(--red); color: var(--red); }
button.danger:hover { background: var(--red); color: #fff; }
input, select, textarea {
  font-family: var(--font);
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: var(--radius);
  font-size: 13px;
  width: 100%;
}
textarea { font-family: var(--mono); resize: vertical; min-height: 100px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
.field { margin-bottom: 12px; }

/* Layout */
.top-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  min-height: 48px;
}
.top-bar h1 { font-size: 16px; font-weight: 700; color: var(--primary); white-space: nowrap; }
.top-bar .spacer { flex: 1; }

.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Left panel */
.left-panel {
  width: 220px;
  min-width: 220px;
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
}
.left-panel h2 {
  padding: 12px 16px 8px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
}
.graph-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 8px;
}
.graph-item {
  padding: 8px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  margin-bottom: 2px;
  font-size: 13px;
  transition: background .1s;
}
.graph-item:hover { background: var(--surface2); }
.graph-item.active { background: var(--primary-dim); }
.graph-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.left-panel .actions { padding: 12px; border-top: 1px solid var(--border); }
.left-panel .actions button { width: 100%; margin-bottom: 6px; }

/* Canvas area */
.canvas-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0) 0 0 / 24px 24px;
}
.canvas-area svg {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0; left: 0;
}
.node-rect {
  cursor: grab;
  transition: filter .15s;
}
.node-rect:hover { filter: brightness(1.15); }
.node-rect.selected { filter: brightness(1.3); }

/* Right panel */
.right-panel {
  width: 300px;
  min-width: 300px;
  border-left: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  padding: 16px;
  display: none;
}
.right-panel.visible { display: block; }
.right-panel h3 { font-size: 14px; margin-bottom: 12px; }
.right-panel .section { margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }

/* Bottom panel */
.bottom-panel {
  border-top: 1px solid var(--border);
  background: var(--surface);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  font-size: 13px;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.status-dot.idle { background: var(--text-dim); }
.status-dot.pending { background: var(--yellow); }
.status-dot.running { background: var(--blue); animation: pulse 1s infinite; }
.status-dot.done { background: var(--green); }
.status-dot.error { background: var(--red); }
.status-dot.completed { background: var(--green); }
.status-dot.stopped { background: var(--yellow); }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

.node-status-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1;
}
.node-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 12px;
  background: var(--surface2);
  font-size: 11px;
}

/* Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  width: 420px;
  max-width: 90vw;
}
.modal h3 { margin-bottom: 16px; }
.modal .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Empty state */
.empty-state {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  color: var(--text-dim);
  gap: 8px;
}
.empty-state .icon { font-size: 48px; opacity: .3; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>GoA</h1>
  <span style="color:var(--text-dim);font-size:13px">Graph of Agents</span>
  <div class="spacer"></div>
  <button onclick="showNewGraphModal()" class="primary">+ New Graph</button>
  <button onclick="refreshGraphs()">Refresh</button>
</div>

<div class="main">
  <!-- Left: Graph list -->
  <div class="left-panel">
    <h2>Graphs</h2>
    <div class="graph-list" id="graphList"></div>
    <div class="actions">
      <button onclick="showNewGraphModal()" class="primary">+ New Graph</button>
    </div>
  </div>

  <!-- Center: Canvas -->
  <div class="canvas-area" id="canvasArea">
    <div class="empty-state" id="emptyState">
      <div class="icon">&#9671;</div>
      <div>Select or create a graph to get started</div>
    </div>
    <svg id="graphSvg" style="display:none"></svg>
  </div>

  <!-- Right: Properties -->
  <div class="right-panel" id="rightPanel">
    <div id="propContent"></div>
  </div>
</div>

<!-- Bottom: Run controls -->
<div class="bottom-panel">
  <span id="runStatus" style="display:flex;align-items:center;gap:6px">
    <span class="status-dot idle"></span> No active run
  </span>
  <div class="node-status-bar" id="nodeStatusBar"></div>
  <div class="spacer"></div>
  <button id="btnRun" onclick="startRun()" disabled>Run</button>
  <button id="btnStop" onclick="stopRun()" disabled class="danger">Stop</button>
</div>

<!-- Modals container -->
<div id="modals"></div>

<script>
const API = '/api/goa';
let graphs = [];
let currentGraph = null;
let selectedNode = null;
let nodePositions = {};
let dragging = null;
let dragOffset = { x: 0, y: 0 };
let pollTimer = null;

// ---- API ----
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  return res.json();
}

async function refreshGraphs() {
  graphs = await api('');
  renderGraphList();
}

async function loadGraph(name) {
  currentGraph = await api('/' + name);
  selectedNode = null;
  layoutNodes();
  renderCanvas();
  renderProps();
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('graphSvg').style.display = '';
  document.getElementById('btnRun').disabled = false;
  startPolling();
}

async function saveCurrentGraph() {
  if (!currentGraph) return;
  const res = await api('', {
    method: 'POST',
    body: JSON.stringify(currentGraph),
  });
  if (res.error) { alert('Save failed: ' + (res.details || [res.error]).join(', ')); return; }
  await refreshGraphs();
}

async function deleteGraph(name) {
  if (!confirm(`Delete graph "${name}"?`)) return;
  await api('/' + name, { method: 'DELETE' });
  if (currentGraph && currentGraph.name === name) {
    currentGraph = null;
    document.getElementById('emptyState').style.display = '';
    document.getElementById('graphSvg').style.display = 'none';
    document.getElementById('rightPanel').classList.remove('visible');
  }
  await refreshGraphs();
}

async function startRun() {
  if (!currentGraph) return;
  await api('/' + currentGraph.name + '/run', { method: 'POST' });
  startPolling();
}

async function stopRun() {
  if (!currentGraph) return;
  await api('/' + currentGraph.name + '/stop', { method: 'POST' });
}

// ---- Polling ----
function startPolling() {
  stopPolling();
  pollRunStatus();
  pollTimer = setInterval(pollRunStatus, 2000);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

async function pollRunStatus() {
  if (!currentGraph) return;
  const data = await api('/' + currentGraph.name + '/run');
  renderRunStatus(data);
}

function renderRunStatus(data) {
  const el = document.getElementById('runStatus');
  const bar = document.getElementById('nodeStatusBar');
  const btnStop = document.getElementById('btnStop');

  if (!data || data.status === 'no_runs') {
    el.innerHTML = '<span class="status-dot idle"></span> No runs yet';
    bar.innerHTML = '';
    btnStop.disabled = true;
    return;
  }

  el.innerHTML = `<span class="status-dot ${data.status}"></span> ${data.run_id} — ${data.status}`;
  btnStop.disabled = data.status !== 'running';

  let badges = '';
  if (data.nodes) {
    for (const [name, info] of Object.entries(data.nodes)) {
      badges += `<span class="node-badge"><span class="status-dot ${info.status}"></span>${name}</span>`;
    }
  }
  bar.innerHTML = badges;

  if (data.status !== 'running') {
    stopPolling();
  }

  renderCanvas();
}

// ---- Graph List ----
function renderGraphList() {
  const el = document.getElementById('graphList');
  if (!graphs.length) {
    el.innerHTML = '<div style="padding:16px;color:var(--text-dim);font-size:13px">No graphs yet</div>';
    return;
  }
  el.innerHTML = graphs.map(g => `
    <div class="graph-item ${currentGraph && currentGraph.name === g.name ? 'active' : ''}"
         onclick="loadGraph('${g.name}')">
      <div>${g.name}</div>
      <div class="meta">${g.node_count} nodes · entry: ${g.entry}</div>
    </div>
  `).join('');
}

// ---- Canvas ----
const NODE_W = 160, NODE_H = 64, PAD = 40;

function layoutNodes() {
  if (!currentGraph || !currentGraph.nodes) return;
  const names = Object.keys(currentGraph.nodes);
  const entry = currentGraph.entry;

  const levels = {};
  const visited = new Set();
  function bfs(name, level) {
    if (visited.has(name)) return;
    visited.add(name);
    levels[name] = Math.max(levels[name] || 0, level);
    const node = currentGraph.nodes[name];
    if (node && node.transitions) {
      for (const t of node.transitions) {
        bfs(t.target, level + 1);
      }
    }
  }
  if (entry && currentGraph.nodes[entry]) bfs(entry, 0);
  for (const n of names) { if (!visited.has(n)) bfs(n, Object.keys(levels).length); }

  const byLevel = {};
  for (const [name, lvl] of Object.entries(levels)) {
    (byLevel[lvl] = byLevel[lvl] || []).push(name);
  }

  const savedPos = nodePositions[currentGraph.name] || {};
  nodePositions[currentGraph.name] = {};

  for (const [lvl, nodes] of Object.entries(byLevel)) {
    nodes.forEach((name, i) => {
      if (savedPos[name]) {
        nodePositions[currentGraph.name][name] = savedPos[name];
      } else {
        nodePositions[currentGraph.name][name] = {
          x: 80 + parseInt(lvl) * (NODE_W + 80),
          y: 80 + i * (NODE_H + PAD),
        };
      }
    });
  }
}

function getPos(name) {
  return (nodePositions[currentGraph.name] || {})[name] || { x: 100, y: 100 };
}

function renderCanvas() {
  if (!currentGraph || !currentGraph.nodes) return;
  const svg = document.getElementById('graphSvg');
  const nodes = currentGraph.nodes;

  let html = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-dim)"/></marker></defs>';

  for (const [name, node] of Object.entries(nodes)) {
    for (const t of node.transitions || []) {
      const from = getPos(name);
      const to = getPos(t.target);
      const fx = from.x + NODE_W, fy = from.y + NODE_H / 2;
      const tx = to.x, ty = to.y + NODE_H / 2;
      const mx = (fx + tx) / 2;
      html += `<path d="M${fx},${fy} C${mx},${fy} ${mx},${ty} ${tx},${ty}" stroke="var(--text-dim)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>`;
      html += `<text x="${mx}" y="${(fy+ty)/2 - 6}" fill="var(--text-dim)" font-size="10" text-anchor="middle">${t.condition}</text>`;
    }
  }

  for (const [name, node] of Object.entries(nodes)) {
    const p = getPos(name);
    const isEntry = name === currentGraph.entry;
    const isSel = name === selectedNode;

    let fill = 'var(--surface2)';
    let stroke = isSel ? 'var(--primary)' : 'var(--border)';
    let sw = isSel ? 2.5 : 1.5;

    if (isEntry) stroke = 'var(--green)';

    html += `<g class="node-rect ${isSel ? 'selected' : ''}"
                data-node="${name}"
                onmousedown="startDrag(event, '${name}')"
                onclick="selectNode('${name}')">
      <rect x="${p.x}" y="${p.y}" width="${NODE_W}" height="${NODE_H}"
            rx="10" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
      <text x="${p.x + NODE_W/2}" y="${p.y + 24}" fill="var(--text)" font-size="13" font-weight="600" text-anchor="middle">${name}</text>
      <text x="${p.x + NODE_W/2}" y="${p.y + 42}" fill="var(--text-dim)" font-size="10" text-anchor="middle">${node.backend}</text>
      ${isEntry ? `<circle cx="${p.x + 12}" cy="${p.y + 12}" r="4" fill="var(--green)"/>` : ''}
    </g>`;
  }

  svg.innerHTML = html;
}

// Drag
function startDrag(e, name) {
  e.stopPropagation();
  dragging = name;
  const p = getPos(name);
  const svg = document.getElementById('graphSvg');
  const pt = svg.getBoundingClientRect();
  dragOffset = { x: e.clientX - pt.left - p.x, y: e.clientY - pt.top - p.y };
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
}
function onDrag(e) {
  if (!dragging) return;
  const svg = document.getElementById('graphSvg');
  const pt = svg.getBoundingClientRect();
  nodePositions[currentGraph.name][dragging] = {
    x: e.clientX - pt.left - dragOffset.x,
    y: e.clientY - pt.top - dragOffset.y,
  };
  renderCanvas();
}
function endDrag() {
  dragging = null;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
}

function selectNode(name) {
  selectedNode = name;
  renderCanvas();
  renderProps();
}

// ---- Properties Panel ----
function renderProps() {
  const panel = document.getElementById('rightPanel');
  const el = document.getElementById('propContent');

  if (!currentGraph) { panel.classList.remove('visible'); return; }

  if (!selectedNode || !currentGraph.nodes[selectedNode]) {
    panel.classList.add('visible');
    el.innerHTML = `
      <h3>${currentGraph.name}</h3>
      <div class="field"><label>Description</label>
        <input value="${currentGraph.description || ''}" onchange="currentGraph.description=this.value"/>
      </div>
      <div class="field"><label>Entry Node</label>
        <select onchange="currentGraph.entry=this.value;renderCanvas()">
          ${Object.keys(currentGraph.nodes).map(n =>
            `<option ${n===currentGraph.entry?'selected':''}>${n}</option>`
          ).join('')}
        </select>
      </div>
      <div class="section">
        <button onclick="showAddNodeModal()" class="primary" style="width:100%;margin-bottom:6px">+ Add Node</button>
        <button onclick="showAddEdgeModal()" style="width:100%;margin-bottom:6px">+ Add Edge</button>
      </div>
      <button onclick="saveCurrentGraph()" class="primary" style="width:100%;margin-bottom:6px">Save Graph</button>
      <button onclick="deleteGraph('${currentGraph.name}')" class="danger" style="width:100%">Delete Graph</button>
    `;
    return;
  }

  panel.classList.add('visible');
  const node = currentGraph.nodes[selectedNode];
  el.innerHTML = `
    <h3>Node: ${node.name}</h3>
    <div class="field"><label>Backend</label>
      <select onchange="currentGraph.nodes['${selectedNode}'].backend=this.value;renderCanvas()">
        <option ${node.backend==='cursor'?'selected':''}>cursor</option>
        <option ${node.backend==='codex'?'selected':''}>codex</option>
        <option ${node.backend==='claude_code'?'selected':''}>claude_code</option>
      </select>
    </div>
    <div class="field"><label>Description</label>
      <input value="${node.description||''}" onchange="currentGraph.nodes['${selectedNode}'].description=this.value"/>
    </div>
    <div class="field"><label>Skill</label>
      <textarea rows="8" onchange="currentGraph.nodes['${selectedNode}'].skill=this.value">${node.skill||''}</textarea>
    </div>
    <div class="section">
      <label>Transitions</label>
      ${(node.transitions||[]).map((t,i) => `
        <div style="display:flex;align-items:center;gap:4px;margin:4px 0;font-size:12px">
          <span>──${t.condition}──&gt; ${t.target}</span>
          <button onclick="removeTransition('${selectedNode}',${i})" class="danger" style="padding:2px 6px;font-size:11px">×</button>
        </div>
      `).join('')}
    </div>
    <button onclick="setEntry('${selectedNode}')" style="width:100%;margin-bottom:6px">Set as Entry</button>
    <button onclick="removeNode('${selectedNode}')" class="danger" style="width:100%">Delete Node</button>
  `;
}

function setEntry(name) {
  currentGraph.entry = name;
  renderCanvas();
  renderProps();
}

function removeNode(name) {
  if (!confirm(`Delete node "${name}"?`)) return;
  delete currentGraph.nodes[name];
  for (const n of Object.values(currentGraph.nodes)) {
    n.transitions = (n.transitions||[]).filter(t => t.target !== name);
  }
  if (currentGraph.entry === name) {
    const remaining = Object.keys(currentGraph.nodes);
    currentGraph.entry = remaining[0] || '';
  }
  selectedNode = null;
  layoutNodes();
  renderCanvas();
  renderProps();
}

function removeTransition(nodeName, idx) {
  currentGraph.nodes[nodeName].transitions.splice(idx, 1);
  renderCanvas();
  renderProps();
}

// ---- Modals ----
function showModal(html) {
  document.getElementById('modals').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() {
  document.getElementById('modals').innerHTML = '';
}

function showNewGraphModal() {
  showModal(`
    <h3>New Graph</h3>
    <div class="field"><label>Name</label><input id="m_name" placeholder="my-workflow"/></div>
    <div class="field"><label>Description</label><input id="m_desc" placeholder="Optional description"/></div>
    <div class="btns">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="createGraph()">Create</button>
    </div>
  `);
  setTimeout(() => document.getElementById('m_name').focus(), 50);
}

async function createGraph() {
  const name = document.getElementById('m_name').value.trim();
  const desc = document.getElementById('m_desc').value.trim();
  if (!name) { alert('Name required'); return; }
  const graph = { name, description: desc, entry: 'start', nodes: {
    start: { name: 'start', skill: '', backend: 'cursor', description: 'Entry point', transitions: [] }
  }};
  const res = await api('', { method: 'POST', body: JSON.stringify(graph) });
  if (res.error) { alert(res.error); return; }
  closeModal();
  await refreshGraphs();
  loadGraph(name);
}

function showAddNodeModal() {
  showModal(`
    <h3>Add Node</h3>
    <div class="field"><label>Name</label><input id="m_nname"/></div>
    <div class="field"><label>Backend</label>
      <select id="m_nbackend">
        <option>cursor</option><option>codex</option><option>claude_code</option>
      </select>
    </div>
    <div class="field"><label>Description</label><input id="m_ndesc"/></div>
    <div class="btns">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="addNode()">Add</button>
    </div>
  `);
}

function addNode() {
  const name = document.getElementById('m_nname').value.trim();
  const backend = document.getElementById('m_nbackend').value;
  const desc = document.getElementById('m_ndesc').value.trim();
  if (!name) { alert('Name required'); return; }
  if (currentGraph.nodes[name]) { alert('Node already exists'); return; }
  currentGraph.nodes[name] = { name, skill: '', backend, description: desc, transitions: [] };
  closeModal();
  layoutNodes();
  renderCanvas();
  renderProps();
}

function showAddEdgeModal() {
  const names = Object.keys(currentGraph.nodes);
  const opts = names.map(n => `<option>${n}</option>`).join('');
  showModal(`
    <h3>Add Transition</h3>
    <div class="field"><label>Source</label><select id="m_esrc">${opts}</select></div>
    <div class="field"><label>Target</label><select id="m_etgt">${opts}</select></div>
    <div class="field"><label>Condition</label><input id="m_econd" value="done"/></div>
    <div class="btns">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="addEdge()">Add</button>
    </div>
  `);
}

function addEdge() {
  const src = document.getElementById('m_esrc').value;
  const tgt = document.getElementById('m_etgt').value;
  const cond = document.getElementById('m_econd').value.trim() || 'done';
  if (src === tgt) { alert('Source and target must be different'); return; }
  currentGraph.nodes[src].transitions = currentGraph.nodes[src].transitions || [];
  currentGraph.nodes[src].transitions.push({ target: tgt, condition: cond });
  closeModal();
  renderCanvas();
  renderProps();
}

// Click on canvas background deselects
document.getElementById('canvasArea').addEventListener('click', (e) => {
  if (e.target.id === 'canvasArea' || e.target.id === 'graphSvg') {
    selectedNode = null;
    renderCanvas();
    renderProps();
  }
});

// Init
refreshGraphs();
</script>
</body>
</html>
